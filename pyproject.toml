[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-most"
version = "1.0.0"
description = "Sepsis-MOST: graph-guided competing-risks prediction of organ failure and adverse events in sepsis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
